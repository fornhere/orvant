name: Package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install distribution
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m pip install --no-deps dist/orvant-*.whl
      - name: Check installed modules and commands
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import importlib, importlib.metadata, pkgutil, orvant_op, orvant_gelisim; [importlib.import_module(m.name) for p in (orvant_op, orvant_gelisim) for m in pkgutil.walk_packages(p.__path__, p.__name__ + '.') if not m.name.endswith('.__main__')]; assert importlib.metadata.version('orvant') == '0.1.0b1'"
          orvant --help
          orvant karsila --help
          orvant mimar --help
          orvant yurut --help
          orvant surdur --help
      - name: Check skill command
        run: python skills/orvant/scripts/project.py --help
      - uses: actions/upload-artifact@v4
        with:
          name: orvant-0.1.0b1-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: dist/*.whl
